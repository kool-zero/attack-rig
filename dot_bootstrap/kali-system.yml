---
# kali-system.yml — system-level provisioning for the Kali attack box.
# chezmoi carries this file to ~/.bootstrap/kali-system.yml but never runs it.
# Run it ONCE after `chezmoi apply`:
#
#   ansible-playbook ~/.bootstrap/kali-system.yml -K
#
# This handles everything that needs root and isn't a dotfile:
# xrdp, syncthing, docker group, pentest toolkit, ProjectDiscovery Go tools.

- name: Kali attack box — system provisioning
  hosts: localhost
  connection: local
  become: true
  gather_facts: true

  vars:
    target_user: "{{ ansible_user_id }}"   # whichever user runs the playbook

  tasks:

    # ── desktop + xrdp ─────────────────────────────────────────────────────
    - name: Install xrdp and XFCE desktop
      apt:
        name:
          - xrdp
          - xorgxrdp
          - kali-desktop-xfce
        state: present
        update_cache: false

    - name: Fix xrdp TLS key permissions (prevents login failed in Guacamole)
      file:
        path: /etc/xrdp/key.pem
        mode: "0640"
        group: ssl-cert

    - name: Add xrdp to ssl-cert group
      user:
        name: xrdp
        groups: ssl-cert
        append: true

    - name: Create .xsession for target user (tells xrdp which desktop to launch)
      copy:
        dest: "/home/{{ target_user }}/.xsession"
        content: "xfce4-session\n"
        owner: "{{ target_user }}"
        mode: "0644"

    - name: Enable and start xrdp
      systemd:
        name: xrdp
        enabled: true
        state: restarted

    # ── syncthing ───────────────────────────────────────────────────────────
    - name: Install Syncthing
      apt:
        name: syncthing
        state: present

    - name: Create ~/data for Syncthing
      file:
        path: "/home/{{ target_user }}/data"
        state: directory
        owner: "{{ target_user }}"
        mode: "0755"

    - name: Create ~/data/vpns directory
      file:
        path: "/home/{{ target_user }}/data/vpns"
        state: directory
        owner: "{{ target_user }}"
        mode: "0755"

    - name: Enable and start Syncthing for target user
      systemd:
        name: "syncthing@{{ target_user }}"
        enabled: true
        state: started

    # ── docker ──────────────────────────────────────────────────────────────
    - name: Add target user to docker group
      user:
        name: "{{ target_user }}"
        groups: docker
        append: true

    # ── pentest toolkit ─────────────────────────────────────────────────────
    - name: Decompress rockyou.txt (Kali ships it gzipped)
      shell: gunzip -f /usr/share/wordlists/rockyou.txt.gz
      args:
        creates: /usr/share/wordlists/rockyou.txt

    - name: Install Certipy via pipx
      become: false
      become_user: "{{ target_user }}"
      shell: pipx install certipy-ad
      args:
        creates: "/home/{{ target_user }}/.local/bin/certipy"

    - name: Install ProjectDiscovery Go tools
      become: false
      become_user: "{{ target_user }}"
      shell: "go install -v {{ item.pkg }}@latest"
      environment:
        GOPATH: "/home/{{ target_user }}/go"
        HOME: "/home/{{ target_user }}"
        PATH: "/usr/local/go/bin:/usr/bin:/bin"
      loop:
        - { pkg: "github.com/projectdiscovery/nuclei/v3/cmd/nuclei",       bin: "nuclei"    }
        - { pkg: "github.com/projectdiscovery/subfinder/v2/cmd/subfinder", bin: "subfinder" }
        - { pkg: "github.com/projectdiscovery/httpx/cmd/httpx",            bin: "httpx"     }
        - { pkg: "github.com/projectdiscovery/naabu/v2/cmd/naabu",         bin: "naabu"     }
        - { pkg: "github.com/projectdiscovery/katana/cmd/katana",           bin: "katana"    }
        - { pkg: "github.com/projectdiscovery/dnsx/cmd/dnsx",              bin: "dnsx"      }
      args:
        creates: "/home/{{ target_user }}/go/bin/{{ item.bin }}"

    - name: Symlink Go tools onto PATH
      file:
        src: "/home/{{ target_user }}/go/bin/{{ item }}"
        dest: "/home/{{ target_user }}/.local/bin/{{ item }}"
        state: link
        force: true
      loop:
        - nuclei
        - subfinder
        - httpx
        - naabu
        - katana
        - dnsx
      failed_when: false

    - name: Update nuclei templates
      become: false
      become_user: "{{ target_user }}"
      command: "/home/{{ target_user }}/.local/bin/nuclei -update-templates"
      changed_when: false
      failed_when: false

    # ── tools repo ──────────────────────────────────────────────────────────
    - name: Create ~/tools directory
      file:
        path: "/home/{{ target_user }}/tools"
        state: directory
        owner: "{{ target_user }}"
        mode: "0755"

    - name: Note — clone your tools repo manually
      debug:
        msg: >
          Clone your tools repo (ligolo.sh, chisel.sh, newtarget.sh) manually:
          git clone git@github.com:kool-zero/tools.git ~/tools
          The wrapper scripts reference ~/.local/bin/chisel and ~/.local/bin/ligolo-proxy
          which chezmoi already placed there via chezmoiexternal.toml.

    # ── final ───────────────────────────────────────────────────────────────
    - name: Done
      debug:
        msg: |
          System provisioning complete.
          Log out and back in for docker group membership to take effect.
          Then: git clone git@github.com:kool-zero/tools.git ~/tools
