"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt for the attack rig: Catppuccin Mocha palette, tuned to be legible on
# any dark terminal. Deliberately avoids Nerd-Font-only powerline glyphs so it renders
# cleanly on a fresh box that hasn't had a patched font installed yet. Wired up as the
# LAST line of ~/.zshrc.

palette = "catppuccin_mocha"

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$cmd_duration\
$line_break\
$character"""

add_newline = true

[username]
show_always = true
style_user = "bold mauve"
style_root = "bold red"
format = "[$user]($style)[@](overlay1)"

[hostname]
ssh_only = false
style = "bold sky"
format = "[$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only](red) "
read_only = " [ro]"
read_only_style = "red"

[git_branch]
symbol = ""
style = "bold mauve"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold peach"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

[cmd_duration]
min_time = 500
style = "bold yellow"
format = "took [$duration]($style) "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"

# --- Catppuccin Mocha palette (Starship's official color table) ---------------------
[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
