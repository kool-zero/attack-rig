# atuin: synced, searchable shell history. Up-arrow and Ctrl-r become a fuzzy,
# full-text search over everything you've ever run, scoped by directory, host, or
# session. Turn on sync (end-to-end encrypted) and your shell history follows you to
# every box.
#
# This ships LOCAL-FIRST: history is recorded and searchable with no account and no
# server. Sync is OFF here. To enable it, point `sync_address` at a server, run
# `atuin register` / `atuin login`, and flip `auto_sync = true` below.

## enable or disable automatic sync (off until you log in to a server)
auto_sync = false

## enable or disable automatic update checks
# update_check = true

## address of the sync server. Default is atuin's public server (shown below). To keep
## your history entirely under your own control, self-host atuin-server and point here:
##   sync_address = "https://atuin.example.com"
## then `atuin register` / `atuin login` against it.
# sync_address = "https://api.atuin.sh"

## which search mode to use
## possible values: prefix, fulltext, fuzzy, skim
# search_mode = "fuzzy"

## which filter mode to use
## possible values: global, host, session, directory
# filter_mode = "global"

## With workspace filtering enabled, atuin filters for commands executed anywhere
## within the current git repository tree.
workspaces = true

## Immediately execute on Enter; press Tab to return to the shell and edit first.
enter_accept = true

## Don't persist obvious secrets to history. These regexes are unanchored (match
## anywhere in the command): handy on a shared or client box where you'd rather not
## bank credentials into your synced history.
history_filter = [
  "^export .*KEY.*=",            # API key exports
  "^export .*TOKEN.*=",          # token exports
  "^export .*PASSWORD.*=",       # password exports
  ".*--password[= ]",            # commands with a --password flag
  ".*--api-key[= ]",             # commands with an --api-key flag
]

## Also match against atuin's built-in secret patterns (AWS keys, GitHub PATs, Slack
## tokens, Stripe keys, ...) and skip storing anything that hits. On by default.
# secrets_filter = true

[sync]
## sync full history records (v2 sync) once you're logged in
records = true

[dotfiles]
## atuin can also sync aliases/vars; left off here to keep this history-only
enabled = false
