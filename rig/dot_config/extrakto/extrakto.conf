# Custom extrakto filters, merged over the bundled defaults.
# Regex needs one capture group (); that span becomes the grabbable token, even mid-string.

[ipv4]
# Bare IPv4 out of anything on screen, e.g. syslog4-10.10.14.7.log -> 10.10.14.7
regex: (\b(?:\d{1,3}\.){3}\d{1,3}\b)
in_all: True

[ipv4port]
# host:port, e.g. 10.10.14.7:8080 -> 10.10.14.7:8080
regex: (\b(?:\d{1,3}\.){3}\d{1,3}:\d{1,5}\b)
in_all: True
